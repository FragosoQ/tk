<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16213A">
<title>Tóquio · 1–10 Nov</title>
<style>
:root{
  --ink:#16213A;        /* indigo escuro — texto/primário */
  --indigo:#2E4A78;     /* indigo médio */
  --shu:#DB4F36;        /* vermelhão (torii) — acento */
  --shu-soft:#fbe7e2;
  --teal:#2F7E8C;       /* transportes */
  --gold:#B8860B;
  --paper:#F2F1EC;      /* fundo papel (frio, não creme) */
  --card:#FBFAF6;
  --line:#E2DFD6;
  --muted:#6C7385;
  --ok:#2E8B6F;
  --shadow:0 1px 2px rgba(22,33,58,.06),0 6px 22px rgba(22,33,58,.07);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px 60px}

/* ---------- HEADER ---------- */
header.top{
  padding:30px 0 16px;position:relative;
}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--shu);font-weight:700;margin:0 0 6px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand .kanji{font-size:52px;font-weight:800;line-height:.9;color:var(--ink);letter-spacing:.04em}
.brand .latin{font-size:30px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.brand .latin small{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.brand .latin small b{color:var(--indigo);font-weight:700}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:5px;margin:18px 0 4px;position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--paper) 70%,rgba(242,241,236,0));padding:8px 0 10px}
.tab{flex:1;min-width:0;border:none;background:#e8e6df;color:var(--indigo);font-weight:700;font-size:12px;
  padding:9px 3px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:focus-visible{outline:3px solid var(--shu);outline-offset:2px}

/* ---------- DAY NAV PILLS ---------- */
.daynav{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:12px;
  padding:7px 11px;cursor:pointer;text-align:center;min-width:54px;transition:.15s}
.pill:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.pill .pk{font-size:18px;font-weight:800;color:var(--indigo);line-height:1}
.pill .pd{font-size:10px;color:var(--muted);font-weight:600;margin-top:3px}
.pill.active{border-color:var(--ink);background:var(--ink)}
.pill.active .pk{color:#fff}.pill.active .pd{color:#cfd6e6}
.pill.trip .pk{color:var(--shu)}
.pill.trip.active{background:var(--shu);border-color:var(--shu)}
.pill.trip.active .pk{color:#fff}

/* ---------- DAY SECTION ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden;scroll-margin-top:120px}
.day.istoday{border-color:var(--shu);box-shadow:0 0 0 2px var(--shu-soft),var(--shadow)}
.dayhead{display:flex;align-items:center;gap:14px;width:100%;border:none;background:none;
  text-align:left;padding:16px 16px;cursor:pointer;color:var(--ink)}
.dayhead:focus-visible{outline:3px solid var(--shu);outline-offset:-3px}
.daynum{flex:0 0 auto;width:50px;height:50px;border-radius:13px;background:var(--ink);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.day.trip .daynum{background:var(--shu)}
.daynum .k{font-size:24px;font-weight:800;line-height:1}
.daynum .n{font-size:9px;letter-spacing:.1em;opacity:.7;margin-top:1px}
.daymeta{flex:1;min-width:0}
.daymeta .dt{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.daymeta .th{font-size:17px;font-weight:800;margin:1px 0 0;line-height:1.25}
.daymeta .zones{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.zpill{font-size:10.5px;font-weight:700;color:var(--indigo);background:#e7ebf3;
  border:1px solid #d3daea;padding:1.5px 7px;border-radius:20px;line-height:1.5;white-space:nowrap}
.day.trip .zpill{color:var(--shu);background:#fdeae5;border-color:#f6cdc1}
.walkbadge{display:inline-block;font-size:10.5px;font-weight:800;color:#2e7d55;background:#e3f2e9;
  border:1px solid #c4e2d1;padding:1px 7px;border-radius:20px;margin-left:8px;letter-spacing:0;
  text-transform:none;vertical-align:1px;white-space:nowrap}
.walkbadge .tr{font-weight:600;opacity:0.85}
.tripbadge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;
  background:var(--shu);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px;text-transform:uppercase}
.chev{flex:0 0 auto;color:var(--muted);transition:transform .2s}
.day.open .chev{transform:rotate(180deg)}
.daybody{display:none;padding:0 16px 18px}
.day.open .daybody{display:block}
.why{font-size:14px;color:var(--indigo);background:#eef1f7;border-left:3px solid var(--indigo);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:2px 0 16px}

/* pass / transport banner for day trips */
.passcard{background:linear-gradient(135deg,#fff,#fdeee9);border:1.5px solid var(--shu);
  border-radius:13px;padding:13px 14px;margin:0 0 16px}
.passcard h4{margin:0 0 4px;font-size:14px;color:var(--shu);letter-spacing:.02em}
.passcard p{margin:0 0 8px;font-size:13px;color:var(--ink)}
.passcard .price{font-weight:800}
.passcard a.bbtn{display:inline-block;background:var(--shu);color:#fff;text-decoration:none;
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px}
.staycard{background:linear-gradient(135deg,#fff,#eef1f7);border:1.5px solid var(--indigo);
  border-radius:13px;padding:13px 14px;margin:0 0 16px}
.staycard h4{margin:0 0 4px;font-size:14px;color:var(--indigo);letter-spacing:.02em;
  display:flex;align-items:center;gap:7px}
.staycard .sname{font-weight:800;font-size:14px;color:var(--ink);margin:0 0 2px}
.staycard .szone{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;margin:0 0 6px}
.staycard p{margin:0 0 8px;font-size:13px;color:var(--ink)}
.staycard .snights{display:inline-block;background:var(--indigo);color:#fff;font-size:11px;
  font-weight:700;padding:2px 8px;border-radius:20px;margin-left:auto}
.staycard a.bbtn{display:inline-block;background:var(--indigo);color:#fff;text-decoration:none;
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px}
.stayactions{display:flex;flex-wrap:wrap;gap:8px}
.staycard a.bbtn.ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--indigo)}
.staycard a.bbtn.ghost:hover{background:var(--indigo);color:#fff}

/* ---------- PLANO DO DIA (botão + modal) ---------- */
.planbtn{display:flex;align-items:center;gap:9px;width:100%;margin:0 0 16px;padding:12px 14px;
  border:1.5px solid var(--shu);border-radius:13px;background:linear-gradient(135deg,#fff,#fdeee9);
  color:var(--shu);font-size:14px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit}
.planbtn:hover{background:var(--shu);color:#fff}
.planbtn .planico{font-size:16px}
.planbtn .planarrow{margin-left:auto;font-size:16px;transition:transform .15s}
.planbtn:hover .planarrow{transform:translateX(3px)}
.planoverlay{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;
  background:rgba(22,33,58,0.55);backdrop-filter:blur(3px);padding:24px 14px;overflow-y:auto}
.planoverlay.show{display:flex}
.planmodal{position:relative;background:var(--paper);border-radius:18px;max-width:560px;width:100%;
  margin:auto;padding:22px 20px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:planpop .22s ease}
@keyframes planpop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.planclose{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:none;
  background:#e8e6df;color:var(--ink);font-size:15px;font-weight:800;cursor:pointer;line-height:1}
.planclose:hover{background:var(--shu);color:#fff}
.planhead{margin:0 34px 16px 0;padding-bottom:14px;border-bottom:2px solid #e0ddd4}
.planhead h3{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--ink);line-height:1.2}
.planhead p{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.plansec{margin:0 0 16px}
.plansec h4{margin:0 0 8px;font-size:14.5px;font-weight:800;color:var(--indigo)}
.plansec ul{margin:0;padding:0;list-style:none}
.plansec li{position:relative;padding:0 0 7px 16px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.plansec li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;
  background:var(--shu)}
.plansec li b{font-weight:800}
.pinrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px}
.pinrow .pinarrow{color:var(--muted);font-weight:800;font-size:13px}
.planpin2{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:11.5px;
  font-weight:700;color:var(--shu);background:#fdeae5;border:1px solid #f6cdc1;
  padding:3px 9px;border-radius:20px;line-height:1.4;transition:.15s;white-space:nowrap}
.planpin2:hover{background:var(--shu);color:#fff;border-color:var(--shu)}
.day.trip .planbtn{border-color:var(--shu)}

/* ---------- MAPA DO DIA ---------- */
.daymap{margin:4px 0 16px;border:1.5px solid #d5ddd5;border-radius:13px;overflow:hidden;background:#eef3ee}
.daymap summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--indigo);user-select:none}
.daymap summary::-webkit-details-marker{display:none}
.daymap .mapico{font-size:15px}
.daymap .mapchev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.daymap[open] .mapchev{transform:rotate(180deg)}
.daymap-body{padding:0 12px 12px}
.daymap-hint{font-size:11px;color:var(--muted);margin:0 2px 8px;text-align:center;font-style:italic}
.daymapsvg{width:100%;height:auto;display:block;border-radius:11px}
.daymap-legend{list-style:none;margin:12px 2px 2px;padding:0;display:grid;
  grid-template-columns:1fr 1fr;gap:5px 14px}
.daymap-legend li{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--ink);line-height:1.3}
.daymap-legend .mnum{flex:none;width:19px;height:19px;border-radius:50%;background:var(--shu);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.daymap-legend .mzone{color:var(--muted);font-style:normal;font-weight:600;font-size:11.5px}
@media(max-width:560px){ .daymap-legend{grid-template-columns:1fr} }

/* ---------- MAPA GLOBAL (aba) ---------- */
.gmap-wrap{margin-top:6px}
.gmap-hint{font-size:12px;color:var(--muted);margin:0 2px 10px;font-style:italic;line-height:1.4}
.globalmapsvg{width:100%;height:auto;display:block;border-radius:16px}
.gmap-days{display:flex;flex-wrap:wrap;gap:7px 12px;margin:14px 2px 4px}
.gday{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink)}
.gday .gdot{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- TIMELINE / STOPS ---------- */
.timeline{position:relative;margin:0;padding:0;list-style:none}
.transit{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:12.5px;font-weight:600;
  padding:7px 0 7px 4px;margin-left:8px;border-left:2px dashed #c9d6da}
.transit .ico{flex:0 0 auto}
.stop{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:12px 13px 12px;margin:0 0 4px}
.stop .toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.stop .head2{display:flex;gap:11px;align-items:flex-start}
.stop .htext{flex:1;min-width:0}
.thumb{flex:0 0 auto;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.thumb svg{width:27px;height:27px}
.thumb.sm{width:42px;height:42px;border-radius:10px}
.thumb.sm svg{width:22px;height:22px}
.thumb.tcomida{background:#fbe7e2;color:#b23a24}
.thumb.thistoria{background:#e5ebf6;color:#2E4A78}
.thumb.tvista{background:#dff0ee;color:#1f6b5c}
.thumb.tanime{background:#ece4f6;color:#6a3fa0}
.thumb.tcompras{background:#f6efda;color:#8a6a08}
.thumb.tarte{background:#fbe4f0;color:#a8347a}
.thumb.tlogistica{background:#e8e9ed;color:#525a6b}
.time{font-size:12px;font-weight:800;color:var(--ink);background:#edeaf0;border-radius:7px;padding:3px 8px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:7px}
.tag.comida{background:#fbe7e2;color:#b23a24}
.tag.historia{background:#e5ebf6;color:#2E4A78}
.tag.vista{background:#dff0ee;color:#1f6b5c}
.tag.anime{background:#ece4f6;color:#6a3fa0}
.tag.compras{background:#f6efda;color:#8a6a08}
.tag.arte{background:#fbe4f0;color:#a8347a}
.tag.logistica{background:#e8e9ed;color:#525a6b}
.stop h5{margin:2px 0 3px;font-size:15.5px;font-weight:800;line-height:1.25}
.stop h5 .jp{font-weight:600;color:var(--muted);font-size:12px;margin-left:5px}
.stop p.d{margin:0 0 8px;font-size:13.5px;color:#39415a}
.stop .dica{font-size:12.5px;color:var(--ink);background:#fffaf2;border:1px dashed #e8d9b8;
  border-radius:9px;padding:7px 9px;margin:0 0 10px}
.stop .dica b{color:var(--gold)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mapbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--ink);
  color:#fff;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px}
.mapbtn:active{transform:translateY(1px)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  font-weight:600;cursor:pointer;user-select:none;margin-left:auto}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.stop.done{opacity:.62}
.stop.done h5{text-decoration:line-through;text-decoration-color:var(--muted)}

/* eat block */
.eat{margin:14px 0 2px}
.eat h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--shu);margin:0 0 8px}
.eat ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.eat li{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 11px}
.eat li .en{font-weight:700;font-size:13.5px}
.eat li .enote{font-size:12px;color:var(--muted)}
.eat li a{margin-left:auto;flex:0 0 auto;color:var(--ink);text-decoration:none;font-size:18px;
  align-self:center;line-height:1}

/* notes list */
.notes{margin:14px 0 0;padding:0;list-style:none}
.notes li{font-size:12.5px;color:#39415a;padding:5px 0 5px 20px;position:relative}
.notes li::before{content:"▸";position:absolute;left:2px;color:var(--shu);font-size:11px;top:6px}

/* ---------- ESSENCIAIS ---------- */
.panel{display:none}
.panel.show{display:block}
.acard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.acard > h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:9px}
.acard > h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--shu);flex:0 0 auto}
.app{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.app:first-of-type{border-top:none}
.app .ai{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.app .ai.p{background:var(--shu)}.app .ai.t{background:var(--teal)}.app .ai.g{background:var(--gold)}
.app .info{flex:1;min-width:0}
.app .info .nm{font-weight:800;font-size:14.5px}
.app .info .nm .role{font-weight:600;color:var(--muted);font-size:12px}
.app .info .ds{font-size:12.5px;color:#39415a;margin-top:2px}
.app a.go{flex:0 0 auto;align-self:center;text-decoration:none;background:#e8e6df;color:var(--indigo);
  font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px}
.tipgrid h4{font-size:13.5px;margin:14px 0 6px;color:var(--indigo)}
.tipgrid h4:first-child{margin-top:0}
.tipgrid ul{margin:0 0 4px;padding-left:18px}
.tipgrid li{font-size:13px;color:#39415a;margin-bottom:5px}
.tipgrid li b{color:var(--ink)}
.emerg{background:#fff4f2;border:1px solid var(--shu);border-radius:11px;padding:11px 13px;margin-top:10px}
.emerg b{color:var(--shu)}

/* ---------- ACHADOS ---------- */
.intro{font-size:13px;color:var(--indigo);background:#eef1f7;border-left:3px solid var(--indigo);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:0 0 14px}
.finds{display:grid;gap:8px}
.find{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;gap:11px}
.find .fbody{flex:1;min-width:0}
.find .fh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.find .fn{font-weight:800;font-size:14px;line-height:1.25}
.find .fn .jp{font-weight:600;color:var(--muted);font-size:11.5px;margin-left:4px}
.find .area{margin-left:auto;font-size:10px;font-weight:700;color:var(--indigo);background:#eef1f7;
  padding:2px 7px;border-radius:6px;white-space:nowrap}
.find .fd{font-size:12.5px;color:#39415a;margin:5px 0 0}
.find .ftip{font-size:11.5px;color:#39415a;background:#fffaf2;border:1px dashed #e8d9b8;
  border-radius:8px;padding:5px 8px;margin-top:6px}
.find .ftip b{color:var(--gold)}
.find .ffoot{display:flex;align-items:center;gap:8px;margin-top:7px}
.find .fday{font-size:10px;font-weight:800;color:var(--shu);background:var(--shu-soft);
  padding:2px 7px;border-radius:6px}
.find a.fpin{margin-left:auto;color:#fff;background:var(--ink);text-decoration:none;font-size:11.5px;
  font-weight:700;padding:6px 10px;border-radius:9px}
.acard.cat{padding:0;overflow:hidden}
.cathead{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;
  padding:15px 16px;cursor:pointer;color:var(--ink);font:inherit}
.cathead:focus-visible{outline:3px solid var(--shu);outline-offset:-3px}
.cathead .dot{width:9px;height:9px;border-radius:50%;background:var(--shu);flex:0 0 auto}
.cathead .cattitle{font-size:16px;font-weight:800;flex:1;min-width:0;line-height:1.2}
.cathead .catcount{font-size:11px;font-weight:800;color:var(--indigo);background:#eef1f7;border-radius:20px;
  padding:2px 9px;flex:0 0 auto}
.cathead .chev{flex:0 0 auto;color:var(--muted);transition:transform .2s}
.acard.cat.open .chev{transform:rotate(180deg)}
.catbody{display:none;padding:0 16px 16px}
.acard.cat.open .catbody{display:block}
.leg{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.leg:last-child{margin-bottom:0}
.legtop{font-weight:800;font-size:13.5px;line-height:1.3}
.legtop .arr{color:var(--shu);margin:0 3px}
.legrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.legline{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:2px 9px;border-radius:6px}
.legtime{font-size:11.5px;color:var(--muted);font-weight:700}

function dayMapSVG(d){
  const seen={}, pts=[];
  d.stops.forEach(s=>{
    const c=COORDS[s.q]; if(!c) return;
    const k=c[0].toFixed(4)+","+c[1].toFixed(4);
    if(seen[k]!==undefined) return;
    seen[k]=1; pts.push({name:s.name,lat:c[0],lng:c[1],zone:ZONE[s.q]||""});
  });
  if(pts.length<2) return "";
  const W=700,H=300,pad=46;
  const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
  const cosLat=Math.cos((minLat+maxLat)/2*Math.PI/180);
  const spanX=(maxLng-minLng)*cosLat||0.0005;
  const spanY=(maxLat-minLat)||0.0005;
  const scale=Math.min((W-2*pad)/spanX,(H-2*pad)/spanY);
  const drawW=spanX*scale,drawH=spanY*scale;
  const offX=(W-drawW)/2,offY=(H-drawH)/2;
  const proj=(lat,lng)=>[offX+((lng-minLng)*cosLat)*scale, offY+((maxLat-lat))*scale];
  let XY=pts.map(p=>proj(p.lat,p.lng));
  const R=30;
  for(let it=0;it<80;it++){
    for(let i=0;i<XY.length;i++)for(let j=i+1;j<XY.length;j++){
      let dx=XY[j][0]-XY[i][0],dy=XY[j][1]-XY[i][1],dist=Math.hypot(dx,dy)||0.01;
      if(dist<R){const push=(R-dist)/2,ux=dx/dist,uy=dy/dist;
        XY[i][0]-=ux*push;XY[i][1]-=uy*push;XY[j][0]+=ux*push;XY[j][1]+=uy*push;}
    }
  }
  XY=XY.map(p=>[Math.max(24,Math.min(W-24,p[0])),Math.max(24,Math.min(H-24,p[1]))]);

  // Rótulos de zona: posicionados acima (ou abaixo) do cluster de cada zona, sem tapar marcadores
  const zg={};
  pts.forEach((p,i)=>{ if(!p.zone) return; (zg[p.zone]=zg[p.zone]||[]).push(XY[i]); });
  const zlabels=[];
  Object.keys(zg).forEach(zn=>{
    const g=zg[zn];
    const cx=g.reduce((a,b)=>a+b[0],0)/g.length;
    const topY=Math.min(...g.map(p=>p[1]));
    const botY=Math.max(...g.map(p=>p[1]));
    let ty = topY-24;
    if(ty<18) ty = botY+32;
    if(ty>H-10) ty = topY-24;
    const halfw = Math.max(30, zn.length*4.6);
    let tx = Math.max(halfw+6, Math.min(W-halfw-6, cx));
    zlabels.push({zn,tx,ty,halfw});
  });
  // des-colisão entre rótulos (afasta na vertical os que se sobrepõem)
  for(let it=0; it<40; it++){
    for(let a=0;a<zlabels.length;a++)for(let b=a+1;b<zlabels.length;b++){
      const A=zlabels[a],B=zlabels[b];
      if(Math.abs(A.tx-B.tx) < (A.halfw+B.halfw) && Math.abs(A.ty-B.ty) < 18){
        const dir = A.ty<=B.ty ? 1 : -1;
        A.ty -= dir*3; B.ty += dir*3;
        A.ty=Math.max(14,Math.min(H-8,A.ty)); B.ty=Math.max(14,Math.min(H-8,B.ty));
      }
    }
  }
  let zones="";
  zlabels.forEach(L=>{
    const esc2=L.zn.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    zones+='<text x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="middle" '
      +'font-size="14.5" font-weight="800" letter-spacing="0.4" fill="var(--indigo)" opacity="0.34" '
      +'style="text-transform:uppercase">'+esc2+'</text>';
  });

  let path="";XY.forEach((p,i)=>{path+=(i?" L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);});
  let marks="";XY.forEach((p,i)=>{
    marks+='<g><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="14" fill="var(--shu)" stroke="#fff" stroke-width="2.5"/>'
      +'<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4.7).toFixed(1)+'" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">'+(i+1)+'</text></g>';
  });
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" class="daymapsvg" role="img" aria-label="Mapa esquemático do dia '+d.n+'">'
    +'<rect x="0.5" y="0.5" width="'+(W-1)+'" height="'+(H-1)+'" rx="14" fill="#e9efe9" stroke="#d5ddd5"/>'
    +zones
    +'<path d="'+path+'" fill="none" stroke="var(--shu)" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.5"/>'
    +marks+'</svg>';
  const legend=pts.map((p,i)=>'<li><span class="mnum">'+(i+1)+'</span><span>'+esc(p.name)+(p.zone?' <em class="mzone">· '+esc(p.zone)+'</em>':'')+'</span></li>').join("");
  return '<details class="daymap"><summary><span class="mapico">🗺️</span>Mapa do dia<span class="mapchev">▾</span></summary>'
    +'<div class="daymap-body"><div class="daymap-hint">Mapa aproximado — pontos pela ordem do dia</div>'
    +svg+'<ol class="daymap-legend">'+legend+'</ol></div></details>';
}

function globalMapSVG(){
  const PAL=["#E4572E","#F3A712","#2E9E5B","#3A86C8","#6A4C93","#D81E5B","#00A5A8","#8A6D3B","#E85D9E","#4A4E69"];
  const items=[];
  DAYS.forEach(d=>{
    const zs={};
    d.stops.forEach(s=>{
      const c=COORDS[s.q]; if(!c) return;
      const z=ZONE[s.q]||s.name; if(zs[z]) return; zs[z]=1;
      items.push({day:d.n, zone:z, lat:c[0], lng:c[1], region:(c[0]<35.4?'hakone':'tokyo')});
    });
  });
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

  function panel(list, x0,y0,pw,ph, showZoneLabels){
    if(!list.length) return "";
    const pad=30;
    const lats=list.map(i=>i.lat), lngs=list.map(i=>i.lng);
    const minLat=Math.min(...lats),maxLat=Math.max(...lats);
    const minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
    const cosLat=Math.cos((minLat+maxLat)/2*Math.PI/180);
    const spanX=(maxLng-minLng)*cosLat||0.0005, spanY=(maxLat-minLat)||0.0005;
    const scale=Math.min((pw-2*pad)/spanX,(ph-2*pad)/spanY);
    const dW=spanX*scale,dH=spanY*scale;
    const offX=x0+(pw-dW)/2, offY=y0+(ph-dH)/2;
    const proj=(lat,lng)=>[offX+((lng-minLng)*cosLat)*scale, offY+((maxLat-lat))*scale];
    let XY=list.map(i=>proj(i.lat,i.lng));
    // des-colisão de marcadores
    const R=30;
    for(let it=0;it<120;it++){
      for(let a=0;a<XY.length;a++)for(let b=a+1;b<XY.length;b++){
        let dx=XY[b][0]-XY[a][0],dy=XY[b][1]-XY[a][1],dist=Math.hypot(dx,dy)||0.01;
        if(dist<R){const push=(R-dist)/2,ux=dx/dist,uy=dy/dist;
          XY[a][0]-=ux*push;XY[a][1]-=uy*push;XY[b][0]+=ux*push;XY[b][1]+=uy*push;}
      }
    }
    XY=XY.map(p=>[Math.max(x0+16,Math.min(x0+pw-16,p[0])),Math.max(y0+16,Math.min(y0+ph-16,p[1]))]);

    // rótulos de zona (nome único por zona; posição = média das ocorrências)
    let labels="";
    if(showZoneLabels){
      const zpos={};
      list.forEach((it2,i)=>{ (zpos[it2.zone]=zpos[it2.zone]||[]).push(XY[i]); });
      const L=[];
      Object.keys(zpos).forEach(zn=>{
        const g=zpos[zn]; const cx=g.reduce((a,b)=>a+b[0],0)/g.length;
        const topY=Math.min(...g.map(p=>p[1]));
        let ty=topY-17; if(ty<y0+14) ty=Math.max(...g.map(p=>p[1]))+22;
        const halfw=Math.max(24,zn.length*4.2);
        let tx=Math.max(x0+halfw+4,Math.min(x0+pw-halfw-4,cx));
        L.push({zn,tx,ty,halfw});
      });
      for(let it=0;it<50;it++)for(let a=0;a<L.length;a++)for(let b=a+1;b<L.length;b++){
        const A=L[a],B=L[b];
        if(Math.abs(A.tx-B.tx)<(A.halfw+B.halfw)&&Math.abs(A.ty-B.ty)<15){
          const dir=A.ty<=B.ty?1:-1; A.ty-=dir*2.5;B.ty+=dir*2.5;
          A.ty=Math.max(y0+11,Math.min(y0+ph-6,A.ty));B.ty=Math.max(y0+11,Math.min(y0+ph-6,B.ty));
        }
      }
      L.forEach(l=>{ labels+='<text x="'+l.tx.toFixed(1)+'" y="'+l.ty.toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a4a63" opacity="0.5">'+esc(l.zn)+'</text>'; });
    }
    // marcadores (cor = dia)
    let marks="";
    list.forEach((it2,i)=>{
      const col=PAL[(it2.day-1)%PAL.length];
      marks+='<g><circle cx="'+XY[i][0].toFixed(1)+'" cy="'+XY[i][1].toFixed(1)+'" r="11" fill="'+col+'" stroke="#fff" stroke-width="2"/>'
        +'<text x="'+XY[i][0].toFixed(1)+'" y="'+(XY[i][1]+3.8).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">'+it2.day+'</text></g>';
    });
    return {labels, marks};
  }

  const W=760, H=560;
  const tokyo=items.filter(i=>i.region==='tokyo');
  const hak=items.filter(i=>i.region==='hakone');

  // painel principal Tóquio
  const main=panel(tokyo, 8, 8, W-16, H-16, true);
  // inset Hakone (canto inferior esquerdo)
  const iw=260, ih=200, ix=16, iy=H-ih-16;
  const inset=panel(hak, ix, iy, iw, ih, true);

  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" class="globalmapsvg" role="img" aria-label="Mapa de todos os pontos do roteiro">';
  svg+='<rect x="0.5" y="0.5" width="'+(W-1)+'" height="'+(H-1)+'" rx="16" fill="#e9efe9" stroke="#d5ddd5"/>';
  // título Tóquio
  svg+='<text x="'+(W-20)+'" y="34" text-anchor="end" font-size="15" font-weight="800" fill="#2E4A78" opacity="0.5" letter-spacing="1">GRANDE TÓQUIO</text>';
  svg+=main.labels+main.marks;
  // inset box
  if(hak.length){
    svg+='<rect x="'+ix+'" y="'+iy+'" width="'+iw+'" height="'+ih+'" rx="12" fill="#dfe8ea" stroke="#b9ccce" stroke-width="1.5"/>';
    svg+='<text x="'+(ix+12)+'" y="'+(iy+22)+'" font-size="13" font-weight="800" fill="#2F7E8C" letter-spacing="0.5">HAKONE · ~80 km SO</text>';
    svg+=inset.labels+inset.marks;
  }
  svg+='</svg>';

  // legenda de dias
  let leg='<div class="gmap-days">';
  DAYS.forEach(d=>{
    const has=items.some(i=>i.day===d.n);
    if(!has) return;
    const col=PAL[(d.n-1)%PAL.length];
    leg+='<span class="gday"><span class="gdot" style="background:'+col+'">'+d.n+'</span>'+d.date+'</span>';
  });
  leg+='</div>';

  return '<div class="gmap-wrap"><div class="gmap-hint">Cada cor é um dia · Hakone mostrado à parte (fica ~80 km a sudoeste)</div>'+svg+leg+'</div>';
}

function stopHTML(d, i, s){
  const id = "d"+d.n+"s"+i;
  const isDone = !!done[id];
  const isTransit = s.tag === "logistica" && (s.name.startsWith("→") || s.time==="Transporte");
  const tagLabel = {comida:"Comida",historia:"História",vista:"Vista",anime:"Anime/Tech",compras:"Compras",arte:"Arte",logistica:"Logística"}[s.tag]||s.tag;
  return `
  <li>
    ${isTransit ? `<div class="transit"><span class="ico">${transitIcon()}</span>${s.desc}</div>` : ""}
    ${isTransit ? "" : `
    <div class="stop ${isDone?'done':''}" id="${id}">
      <div class="head2">
        ${thumb(TAG_ICON[s.tag]||'star', 't'+s.tag)}
        <div class="htext">
          <div class="toprow">
            <span class="time">${s.time}</span>
            <span class="tag ${s.tag}">${tagLabel}</span>
          </div>
          <h5>${s.name}${s.jp?` <span class="jp">${s.jp}</span>`:""}</h5>
        </div>
      </div>
      <p class="d">${s.desc}</p>
      ${s.dica?`<div class="dica"><b>Dica ·</b> ${s.dica}</div>`:""}
      <div class="actions">
        <a class="mapbtn" href="${mapsLink(s.q)}" target="_blank" rel="noopener">📍 Mapa</a>
        <label class="chk"><input type="checkbox" ${isDone?"checked":""} onchange="toggle('${id}',this.checked)"> visitado</label>
      </div>
    </div>`}
  </li>`;
}

function dayZones(d){
  const seen={}, out=[];
  d.stops.forEach(s=>{
    const z = ZONE[s.q];
    if(!z || seen[z]) return;
    seen[z]=1; out.push(z);
  });
  return out;
}

function dayWalk(d){
  // pontos únicos pela ordem do roteiro
  const seen={}, pts=[];
  d.stops.forEach(s=>{
    const c=COORDS[s.q]; if(!c) return;
    const k=c[0].toFixed(4)+","+c[1].toFixed(4);
    if(seen[k]) return; seen[k]=1; pts.push(c);
  });
  const hav=(a,b)=>{const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLng=(b[1]-a[1])*Math.PI/180;
    const s=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));};
  const ROUTE=1.3, WALK_MAX=2.5; // >2.5 km em linha reta = comboio/metro/barco, não conta como a pé
  let km=0, transit=0;
  for(let i=1;i<pts.length;i++){
    const dkm=hav(pts[i-1],pts[i]);
    if(dkm>WALK_MAX){ transit++; continue; }
    km += dkm*ROUTE;
  }
  const rounded = km<1 ? Math.round(km*10)/10 : Math.round(km*2)/2;
  return {km:rounded, transit};
}

function dayHTML(d){
  const stops = d.stops.map((s,i)=>stopHTML(d,i,s)).join("");
  const eat = d.eat ? `
    <div class="eat">
      <h4>Onde comer</h4>
      <ul>${d.eat.map(e=>`
        <li><div><div class="en">${e.name}</div><div class="enote">${e.note}</div></div>
        <a href="${mapsLink(e.q)}" target="_blank" rel="noopener" aria-label="Mapa">📍</a></li>`).join("")}
      </ul>
    </div>` : "";
  const notes = d.notes ? `<ul class="notes">${d.notes.map(n=>`<li>${n}</li>`).join("")}</ul>` : "";
  const pass = d.pass ? `
    <div class="passcard">
      <h4>${d.pass.title}</h4>
      <p>${d.pass.text}</p>
      <p class="price">${d.pass.price}</p>
      ${d.pass.extra?`<p style="font-size:12px;color:#6C7385;margin-bottom:8px">${d.pass.extra}</p>`:""}
      <a class="bbtn" href="${d.pass.link}" target="_blank" rel="noopener">Mais info</a>
    </div>` : "";
  const stay = d.stay ? `
    <div class="staycard">
      <h4>🛏️ Pernoita ${d.stay.nights?`<span class="snights">${d.stay.nights}</span>`:""}</h4>
      <div class="sname">${d.stay.name}</div>
      <div class="szone">${d.stay.zone}</div>
      <p>${d.stay.note}</p>
      <div class="stayactions">
        ${d.stay.link?`<a class="bbtn" href="${d.stay.link}" target="_blank" rel="noopener">Ver alojamento</a>`:""}
        ${d.stay.map?`<a class="bbtn ghost" href="${mapsLink(d.stay.map)}" target="_blank" rel="noopener">📍 Ver no mapa</a>`:""}
      </div>
    </div>` : "";
  return `
  <section class="day ${d.trip?'trip':''}" id="day${d.n}" data-day="${d.day}">
    <button class="dayhead" aria-expanded="false" onclick="toggleDay(${d.n})">
      <span class="daynum"><span class="k">${d.kanji}</span><span class="n">DIA ${d.n}</span></span>
      <span class="daymeta">
        <span class="dt">${d.date} · ${d.dow}${(()=>{const w=dayWalk(d);return w.km>0?' <span class="walkbadge">🚶 ~'+w.km+' km'+(w.transit?' <span class="tr">+🚃</span>':'')+'</span>':'';})()}</span>
        <span class="th">${d.theme}${d.trip?'<span class="tripbadge">excursão</span>':''}</span>
        ${(()=>{const zs=dayZones(d);return zs.length?'<span class="zones">'+zs.map(z=>'<span class="zpill">'+z+'</span>').join('')+'</span>':'';})()}
      </span>
      <span class="chev">▾</span>
    </button>
    <div class="daybody">
      <div class="why">${d.why}</div>
      ${DAYPLAN[d.n]?`<button class="planbtn" onclick="openPlan(${d.n})"><span class="planico">📋</span>Plano do dia<span class="planarrow">→</span></button>`:''}
      ${stay}
      ${pass}
      <ol class="timeline">${stops}</ol>
      ${dayMapSVG(d)}
      ${eat}
      ${notes}
    </div>
  </section>`;
}

function ordered(){ return DAYS.slice().sort((a,b)=>a.n-b.n); }

function renderDays(){
  const list = ordered();
  document.getElementById("days").innerHTML = list.map(dayHTML).join("");
  // nav pills
  document.getElementById("daynav").innerHTML = list.map(d=>`
    <button class="pill ${d.trip?'trip':''}" id="pill${d.n}" onclick="goDay(${d.n})">
      <div class="pk">${d.kanji}</div><div class="pd">${d.day}/${d.mon}</div>
    </button>`).join("");
}

  const day = it.day ? `<span class="fday">${it.day}</span>` : "";
  const tip = it.tip ? `<div class="ftip"><b>Dica ·</b> ${it.tip}</div>` : "";
  const foot = (it.day || it.q) ? `<div class="ffoot">${day}${pin}</div>` : "";
  return `
   <div class="find">
     ${thumb(icon||'star', cls||'tlogistica', true)}
     <div class="fbody">
       <div class="fh">
         <span class="fn">${it.name}${it.jp?` <span class="jp">${it.jp}</span>`:""}</span>
         ${it.area?`<span class="area">${it.area}</span>`:""}
       </div>
       ${it.desc?`<div class="fd">${it.desc}</div>`:""}
       ${tip}
       ${foot}
     </div>
   </div>`;
}

function legHTML(g){
  const arrow = g.label.indexOf("→")>=0 ? g.label.replace(/→/g,'<span class="arr">→</span>') : g.label;
  return `
   <div class="leg">
     <div class="legtop">${arrow}</div>
     <div class="legrow">
       <span class="legline" style="background:${g.color}">${g.line}</span>
       ${g.time?`<span class="legtime">${g.time}</span>`:""}
     </div>
     ${g.desc?`<div class="legnote">${g.desc}</div>`:""}
   </div>`;
}

function renderEstadias(){
  const top = `<div class="intro">Onde dormes em cada etapa da viagem, por ordem. Toca em "Ver alojamento" para abrir o site do hotel.</div>`;
  // Agrupa noites consecutivas no mesmo alojamento
  const groups = [];
  ordered().forEach(d=>{
    if(!d.stay) return;
    const last = groups[groups.length-1];
    if(last && last.name===d.stay.name){
      last.days.push(d);
    } else {
      groups.push({name:d.stay.name, stay:d.stay, days:[d]});
    }
  });
  const cards = groups.map(g=>{
    const first = g.days[0], lastD = g.days[g.days.length-1];
    const range = g.days.length>1
      ? `${first.date} – ${lastD.date}`
      : `${first.date}`;
    const dias = g.days.length>1
      ? `Dias ${first.n}–${lastD.n}`
      : `Dia ${first.n}`;
    const nights = g.days.length;
    return `
    <div class="staycard">
      <h4>🛏️ ${dias} · ${first.dow}${g.days.length>1?` → ${lastD.dow}`:""}
        <span class="snights">${nights} ${nights>1?"noites":"noite"}</span></h4>
      <div class="sname">${g.stay.name}</div>
      <div class="szone">${g.stay.zone} · ${range}</div>
      <p>${g.stay.note}</p>
      <div class="stayactions">
        ${g.stay.link?`<a class="bbtn" href="${g.stay.link}" target="_blank" rel="noopener">Ver alojamento</a>`:""}
        ${g.stay.map?`<a class="bbtn ghost" href="${mapsLink(g.stay.map)}" target="_blank" rel="noopener">📍 Ver no mapa</a>`:""}
      </div>
    </div>`;
  }).join("");
  document.getElementById("panel-estadias").innerHTML = top + cards;
}

let openDay = null;
function openPlan(n){
  const p = DAYPLAN[n];
  if(!p) return;
  const body = p.sections.map(s=>
    '<div class="plansec"><h4>'+s.h+'</h4><ul>'+
    s.items.map(it=>{
      if(typeof it === "string") return '<li>'+it+'</li>';
      const pinLink=(q,label)=>'<a class="planpin2" href="'+mapsLink(q)+'" target="_blank" rel="noopener" title="Abrir no Google Maps">📍 '+label+'</a>';
      if(it.from && it.to){
        const row='<div class="pinrow">'+pinLink(it.from,"Partida")+'<span class="pinarrow">→</span>'+pinLink(it.to,"Chegada")+'</div>';
        return '<li>'+it.txt+row+'</li>';
      }
      if(it.pin){
        const single='<div class="pinrow">'+pinLink(it.pin,"Ver no mapa")+'</div>';
        return '<li>'+it.txt+single+'</li>';
      }
      return '<li>'+it.txt+'</li>';
    }).join('')+
    '</ul></div>'
  ).join('');
  document.getElementById("plancontent").innerHTML =
    '<div class="planhead"><h3 id="plantitle">'+p.title+'</h3><p>'+p.subtitle+'</p></div>'+body;
  const ov = document.getElementById("planoverlay");
  ov.classList.add("show");
  ov.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closePlan(){
  const ov = document.getElementById("planoverlay");
  ov.classList.remove("show");
  ov.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePlan(); });

function toggleDay(n){
  const sec = document.getElementById("day"+n);
  const wasOpen = sec.classList.contains("open");
  if(wasOpen){
    sec.classList.remove("open");
    sec.querySelector(".dayhead").setAttribute("aria-expanded","false");
  } else {
    sec.classList.add("open");
    sec.querySelector(".dayhead").setAttribute("aria-expanded","true");
  }
  syncPills();
}
function goDay(n){
  const sec = document.getElementById("day"+n);
  if(!sec.classList.contains("open")) toggleDay(n);
  sec.scrollIntoView({behavior:"smooth", block:"start"});
  syncPills();
}
function syncPills(){
  DAYS.forEach(d=>{
    const sec = document.getElementById("day"+d.n);
    const pill = document.getElementById("pill"+d.n);
    if(pill) pill.classList.toggle("active", sec.classList.contains("open"));
  });
}

const TAB_IDS = ["roteiro","estadias","mapa","achados","estacoes","essenciais"];
function showTab(which){
  TAB_IDS.forEach(t=>{
    const on = t===which;
    document.getElementById("panel-"+t).classList.toggle("show", on);
    document.getElementById("tab-"+t).setAttribute("aria-selected", on);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function markToday(){
  const now = new Date();
  if(now.getFullYear()!==TRIP_YEAR) return null;
  const mon = now.getMonth()+1, dd = now.getDate();
  const match = DAYS.find(d=>d.mon===mon && d.day===dd);
  if(match){
    const sec = document.getElementById("day"+match.n);
    sec.classList.add("istoday");
    return match.n;
  }
  return null;
}

toggleDay(todayN || 1);
